[project]
name = "revenue-recovery-engine"
version = "1.0.0"
description = "RevenueOS — AI Revenue Recovery & Optimization Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.2.0"
]

[tool.vercel]
entrypoint = "backend/app/main.py"
